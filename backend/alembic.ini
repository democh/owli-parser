# Alembic 配置：应用内 CLI（owli db upgrade）自行解析路径，不依赖当前 shell 目录。
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url 由 env.py 从应用集中配置读取，此处不写死。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
