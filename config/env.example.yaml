# owli-parser 环境覆盖配置示例（无密钥）。
# 使用方式：OWLI_CONFIG_FILE=/path/to/env.override.yaml，值会覆盖 resources/defaults.yaml，
# 更高优先级仍为 OWLI_ 前缀环境变量（OWLI_JOBS__LEASE_SECONDS 等）。
# 密钥（pepper、云凭据）不写在这里，只写引用并通过 SecretResolver（env:/file:）解析。
schema_version: "1.0"
app:
  name: owli-parser
  environment: production
  bind_host: 0.0.0.0
  public_base_url: https://owli.example.internal

database:
  url: "postgresql+asyncpg://owli:***@postgres:5432/owli"
  pool_size: 10
  statement_timeout_ms: 15000

broker:
  url: "redis://valkey:6379/0"

network:
  mode: offline
  # 获批内网文件服务（offline 模式下唯一允许的出网目标）
  internal_allowlist: []

auth:
  session:
    cookie_secure: true
    cookie_samesite: lax
  session_pepper_ref: "env:OWLI_SESSION_PEPPER"

tokens:
  pepper_ref: "env:OWLI_TOKEN_PEPPER"
  ttl_default_seconds: 7776000

imports:
  url_secret_key_ref: "env:OWLI_SOURCE_URL_KEY"

storage:
  default_profile_ref: local-primary
  local:
    roots:
      - id: local-primary-root
        path: /data/artifacts
        quota_bytes: null

jobs:
  cpu_slots: 4
  gpu_slots: 0

retrieval:
  enabled: true
  # memory 仅开发/测试；生产必须使用跨进程索引。
  dense_backend: qdrant
  lexical_backend: opensearch
  qdrant:
    url: http://qdrant:6333
    collection: owli_chunks
    api_key_ref: env:OWLI_QDRANT_API_KEY
    timeout_seconds: 10
    verify_tls: true
  opensearch:
    url: https://opensearch:9200
    index: owli_chunks
    username_ref: env:OWLI_OPENSEARCH_USERNAME
    password_ref: env:OWLI_OPENSEARCH_PASSWORD
    timeout_seconds: 10
    verify_tls: true
    refresh_on_write: true

observability:
  log_json: true
  log_level: INFO
